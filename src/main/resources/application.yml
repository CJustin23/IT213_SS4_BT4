spring:
  application:
    name: incident-workflow
  datasource:
    url: jdbc:h2:mem:incidentdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true      # Truy cap http://localhost:8080/h2-console de xem DB

server:
  port: 8080

logging:
  level:
    com.rikkei.incidentworkflow: INFO
